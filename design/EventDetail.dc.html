<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: #111827; text-decoration: none; }
    a:hover { color: #6b7280; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="height: 180px; background: #111827; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;">
    <div style="width: 36px; height: 36px; border-radius: 999px; background: rgba(255,255,255,0.16); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"></path>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px;">Arijit Singh Live</div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.72);">DY Patil Stadium, Navi Mumbai</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 20px;">

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 11px; font-weight: 600; color: #9ca3af; letter-spacing: 0.5px;">DATE</div>
        <div style="font-size: 14px; font-weight: 600; color: #111827;">Sat, 12 Oct</div>
      </div>
      <div style="flex-grow: 1; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 3px;">
        <div style="font-size: 11px; font-weight: 600; color: #9ca3af; letter-spacing: 0.5px;">GATES OPEN</div>
        <div style="font-size: 14px; font-weight: 600; color: #111827;">5:00 PM</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13px; font-weight: 600; color: #6b7280; letter-spacing: 0.5px;">CHOOSE YOUR SPOT</div>

      <div style="border: 2px solid #111827; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 14px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 16V11l1.8-4.2A2 2 0 0 1 8.6 5.5h6.8a2 2 0 0 1 1.8 1.3L19 11v5"></path>
          <path d="M5 16h14v2.5h-3V16M8 18.5H5V16"></path>
          <circle cx="8" cy="13" r="1"></circle>
          <circle cx="16" cy="13" r="1"></circle>
        </svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 15px; font-weight: 600; color: #111827;">Car</div>
          <div style="font-size: 12px; color: #22c55e; font-weight: 600;">42 spots left</div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="font-size: 17px; font-weight: 700; color: #111827;">&#8377;150</div>
          <div style="width: 22px; height: 22px; border-radius: 999px; background: #111827; display: flex; align-items: center; justify-content: center;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="m5 12 5 5L20 7"></path>
            </svg>
          </div>
        </div>
      </div>

      <div style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 14px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="5.5" cy="16.5" r="3.5"></circle>
          <circle cx="18.5" cy="16.5" r="3.5"></circle>
          <path d="M5.5 16.5h5l4-7h-3"></path>
          <path d="m14.5 9.5 4 7"></path>
          <path d="M15 6h3"></path>
        </svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 15px; font-weight: 600; color: #111827;">Bike</div>
          <div style="font-size: 12px; color: #22c55e; font-weight: 600;">110 spots left</div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="font-size: 17px; font-weight: 700; color: #111827;">&#8377;80</div>
          <div style="width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #e5e7eb;"></div>
        </div>
      </div>

      <div style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 14px; opacity: 0.55;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="7" width="18" height="10" rx="2"></rect>
          <path d="M7 17v2M17 17v2"></path>
        </svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
          <div style="font-size: 15px; font-weight: 600; color: #111827;">Oversized</div>
          <div style="font-size: 12px; color: #ef4444; font-weight: 600;">Sold out</div>
        </div>
        <div style="font-size: 17px; font-weight: 700; color: #9ca3af;">&#8377;300</div>
      </div>
    </div>

    <div style="border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; display: flex; gap: 10px; align-items: flex-start;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 16v-4M12 8h.01"></path>
      </svg>
      <div style="font-size: 13px; color: #6b7280; line-height: 1.5;">Gate 3 entry only. Your pass is checked at the barrier &mdash; keep it open on your phone.</div>
    </div>

  </div>

  <div style="border-top: 1px solid #e5e7eb; padding: 16px 20px 28px 20px; display: flex; align-items: center; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 1px;">
      <div style="font-size: 12px; color: #6b7280;">Car &middot; 1 spot</div>
      <div style="font-size: 20px; font-weight: 700; color: #111827;">&#8377;150</div>
    </div>
    <div style="flex-grow: 1; background: #111827; border-radius: 8px; min-height: 48px; display: flex; align-items: center; justify-content: center;">
      <span style="font-size: 15px; font-weight: 600; color: #ffffff;">Continue</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
