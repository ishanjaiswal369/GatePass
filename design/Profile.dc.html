<!doctype html>
<html>

<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box;">

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 72px 28px 0 28px;">
    <div style="width: 52px; height: 52px; border-radius: 999px; background: #22c55e; display: flex; align-items: center; justify-content: center;">

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 27px; font-weight: 700; color: #111827; letter-spacing: -0.5px;">Email verified</div>
      <div style="font-size: 14px; color: #6b7280; line-height: 1.55;">One last thing &mdash; what should we call you? Organizers see this on your pass at the gate.</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 30px 28px 28px 28px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 13px; font-weight: 600; color: #111827;">First name</div>
      <div style="border: 1px solid #111827; border-radius: 8px; min-height: 48px; display: flex; align-items: center; padding: 0 13px;">
        <span style="font-size: 15px; color: #111827;">Priya</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="display: flex; align-items: baseline; gap: 6px;">
        <span style="font-size: 13px; font-weight: 600; color: #111827;">Last name</span>
        <span style="font-size: 11px; color: #9ca3af;">optional</span>
      </div>
      <div style="border: 1px solid #e5e7eb; border-radius: 8px; min-height: 48px; display: flex; align-items: center; padding: 0 13px;">
        <span style="font-size: 15px; color: #9ca3af;">Leave blank if you go by one name</span>
      </div>
    </div>

    <div style="background: #111827; border-radius: 8px; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 16px; font-weight: 600; color: #ffffff;">Continue</span>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h13M13 6l6 6-6 6"></path>
      </svg>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; display: flex; gap: 11px; align-items: flex-start;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M5 21v-1a7 7 0 0 1 14 0v1"></path>
      </svg>
      <div style="font-size: 12px; color: #6b7280; line-height: 1.55;">This screen only appears when we don&#39;t already have your name &mdash; signing up normally skips it.</div>
    </div>
  </div>

</div>
