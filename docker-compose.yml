services:
  db:
    image: postgres:16-alpine
    container_name: gatepass-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gatepass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  be:
    build: ./be
    container_name: gatepass-be
    env_file:
      - ./be/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gatepass?schema=public
      PORT: 3000
      LOG_PRETTY: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./be/logs:/app/logs
      # Local storage writes photos and ownership documents here. Without the
      # mount they lived in the container's own layer, and every
      # `up --build` replaced the container and 404'd every upload.
      - ./be/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy --schema prisma/schema && node dist/index.js"

volumes:
  pgdata:
